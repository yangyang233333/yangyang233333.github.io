baseURL: "https://yangyang233333.github.io/"
defaultContentLanguage: "zh"
languages:
  zh:
    label: "中文"
    locale: "zh-CN"
    direction: "ltr"
    weight: 1
title: "Hellokitty's Blog"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  description: "Hellokitty's Blog"
  author: "Hellokitty"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: "Hellokitty's Blog 👋"
    Content: "AI Infra / Storage / Compute / C++"

  socialIcons:
    - name: github
      url: "https://github.com/yangyang233333"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON
